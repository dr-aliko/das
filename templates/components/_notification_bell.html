{% if user.is_student %}
<div x-data="notifPanel()" class="relative">

  {# Keep collapsed sidebar badge in sync with notifUnread #}
  <span x-effect="
    var b = document.getElementById('das-bell-collapsed-badge');
    if (b) {
      b.textContent = notifUnread > 9 ? '9+' : notifUnread;
      b.style.display = notifUnread > 0 ? 'flex' : 'none';
    }" style="display:none;"></span>

  {# Bell button — opens wide panel; also responds to open-notif-panel event from collapsed sidebar #}
  <button @click="open = true"
          @open-notif-panel.window="open = true"
          class="relative h-9 w-9 rounded-lg flex items-center justify-center
                 text-[var(--muted)] hover:bg-[var(--surface-2)] hover:text-[var(--heading)]
                 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-steel-400"
          aria-label="Bildirimler">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span x-show="notifUnread > 0" x-cloak
          x-text="notifUnread > 9 ? '9+' : notifUnread"
          style="position:absolute;top:-2px;right:-2px;min-width:1.125rem;height:1.125rem;
                 border-radius:9999px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;
                 display:flex;align-items:center;justify-content:center;padding:0 2px;
                 pointer-events:none;line-height:1;">
    </span>
  </button>

  {# Wide panel — teleported to body so it covers fixed header/sidebar on iOS Safari #}
  <template x-teleport="body">
    <div x-show="open" x-cloak
         @keydown.escape.window="open = false"
         style="position:fixed;inset:0;z-index:200;">

      {# Backdrop #}
      <div @click="open = false"
           style="position:absolute;inset:0;background:rgba(9,11,20,0.5);backdrop-filter:blur(4px);"></div>

      {# Panel — right drawer on desktop, full-width bottom sheet on mobile #}
      <div x-show="open"
           x-transition:enter="transition ease-out duration-250"
           x-transition:enter-start="translate-x-full"
           x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="translate-x-0"
           x-transition:leave-end="translate-x-full"
           class="notif-slide-panel"
           style="position:absolute;inset-y:0;right:0;width:min(440px,100vw);
                  background:var(--surface-1);border-left:1px solid var(--border);
                  display:flex;flex-direction:column;overflow:hidden;"
           @click.stop>

        {# Header #}
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <h2 style="font-size:15px;font-weight:700;color:var(--heading);margin:0;">Bildirimler</h2>
            <span x-show="notifUnread > 0" x-cloak x-text="notifUnread"
                  style="min-width:20px;height:20px;border-radius:9999px;background:#ef4444;
                         color:#fff;font-size:11px;font-weight:700;
                         display:flex;align-items:center;justify-content:center;padding:0 4px;">
            </span>
          </div>

          <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
            <button x-show="notifUnread > 0" x-cloak @click="notifMarkAllRead()"
                    style="padding:5px 9px;border-radius:8px;border:1px solid var(--border);
                           background:var(--surface-2);color:var(--muted);font-size:12px;
                           font-weight:600;cursor:pointer;white-space:nowrap;">
              Okundu yap
            </button>

            <template x-if="!notifConfirmDeleteAll">
              <button x-show="notifications.filter(function(n){return !n._hidden;}).length > 0"
                      @click="notifConfirmDeleteAll = true"
                      style="padding:5px 9px;border-radius:8px;border:1px solid rgba(239,68,68,.4);
                             background:rgba(239,68,68,.07);color:#dc2626;font-size:12px;
                             font-weight:600;cursor:pointer;white-space:nowrap;">
                Tümünü sil
              </button>
            </template>
            <template x-if="notifConfirmDeleteAll">
              <div style="display:flex;align-items:center;gap:4px;">
                <span style="font-size:12px;color:var(--muted);white-space:nowrap;">Emin misin?</span>
                <button @click="notifConfirmDeleteAll = false"
                        style="padding:4px 8px;border-radius:8px;border:1px solid var(--border);
                               background:var(--surface-2);color:var(--muted);font-size:12px;
                               font-weight:600;cursor:pointer;">İptal</button>
                <button @click="notifDeleteAll()"
                        style="padding:4px 8px;border-radius:8px;border:none;
                               background:#dc2626;color:#fff;font-size:12px;
                               font-weight:600;cursor:pointer;">Evet</button>
              </div>
            </template>

            <button @click="open = false"
                    style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;
                           border:none;border-radius:8px;background:transparent;
                           color:var(--muted);cursor:pointer;"
                    onmouseenter="this.style.background='var(--surface-2)'"
                    onmouseleave="this.style.background='transparent'"
                    aria-label="Kapat">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>

        {# Scrollable list — uses shared partial #}
        <div style="flex:1;overflow-y:auto;">
          {% include "components/_notif_item_list.html" %}
        </div>

        {# Pagination #}
        <template x-if="notifHasMore">
          <div style="padding:12px 16px;border-top:1px solid var(--border);text-align:center;flex-shrink:0;">
            <button @click="notifLoadMore()"
                    style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);
                           background:var(--surface-2);color:var(--muted);font-size:13px;
                           font-weight:600;cursor:pointer;">
              Daha fazla göster
            </button>
          </div>
        </template>

      </div>
    </div>
  </template>

</div>
{% endif %}
