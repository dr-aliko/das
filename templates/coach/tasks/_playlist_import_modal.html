{# YouTube Playlist Import Modal — rendered inside panel() scope; controlled by playlistImporter() from tasks_panel.js #}
<div x-data="playlistImporter()"
     @open-playlist-importer.window="open()"
     x-show="show" x-cloak
     class="print:hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4"
     @keydown.escape.window="close()">
  <div class="rounded-2xl shadow-card-lg w-full max-w-md bg-[var(--surface-1)] border border-[var(--border)]"
       @click.stop>

    <div class="flex items-center justify-between px-6 py-4 border-b border-[var(--border)]">
      <h2 class="text-base font-semibold text-[var(--heading)]">YouTube Playlist Ekle</h2>
      <button @click="close()"
              class="w-7 h-7 flex items-center justify-center text-[var(--muted)] hover:text-[var(--heading)]
                     hover:bg-[var(--surface-2)] rounded-lg transition text-lg leading-none">&times;</button>
    </div>

    <div class="p-6 space-y-4">

      {# ── Input / Error ── #}
      <template x-if="step === 'input' || step === 'error'">
        <div class="space-y-4">

          {# ── My Playlists list ── #}
          <template x-if="loadingPlaylists && myPlaylists.length === 0">
            <p class="text-xs text-[var(--muted-2)] text-center py-1">Yükleniyor…</p>
          </template>
          <template x-if="myPlaylists.length > 0">
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-xs font-semibold text-[var(--muted)] uppercase tracking-wide">Playlistlerim</p>
                <span class="text-[10px] text-[var(--muted-2)]" x-text="myPlaylists.length + ' playlist'"></span>
              </div>
              <div class="space-y-1 max-h-44 overflow-y-auto rounded-xl">
                <template x-for="p in myPlaylists" :key="p.pk">
                  <div class="flex items-center gap-2 px-3 py-2 rounded-lg
                              bg-[var(--surface-2)] border border-[var(--border)]">
                    <div class="flex-1 min-w-0">
                      <p class="text-xs font-medium text-[var(--heading)] truncate" x-text="p.title"></p>
                      <p class="text-[10px] text-[var(--muted-2)]"
                         x-text="p.exam_type + (p.subject_display ? ' · ' + p.subject_display : '') + ' · ' + p.video_count + ' video'"></p>
                    </div>
                    <template x-if="p.is_mine">
                      <button @click="deletePl(p.pk)"
                              :title="pendingDeletePk === p.pk ? 'Onaylamak için tekrar tıkla' : 'Sil'"
                              :class="pendingDeletePk === p.pk
                                ? 'text-ruby-500 bg-ruby-tint border-ruby-500/30'
                                : 'text-[var(--muted-2)] hover:text-ruby-400 hover:bg-ruby-500/10 border-transparent'"
                              class="shrink-0 h-7 flex items-center justify-center rounded-lg border
                                     transition px-1.5 gap-1 text-[10px] font-bold">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        <template x-if="pendingDeletePk === p.pk">
                          <span>Emin misin?</span>
                        </template>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
              <p x-show="deleteError" x-text="deleteError"
                 class="text-ruby-500 text-xs bg-ruby-tint border border-ruby-500/30 rounded-lg px-3 py-2"></p>
            </div>
          </template>

          {# ── URL input ── #}
          <div>
            <label class="block text-xs font-semibold text-[var(--muted)] mb-1.5 uppercase tracking-wide">Yeni Playlist URL</label>
            <input x-model="url" type="text"
                   placeholder="https://youtube.com/playlist?list=…"
                   @keydown.enter="doPreview()"
                   class="w-full border border-[var(--border)] rounded-lg px-3 py-2 text-sm bg-[var(--surface-2)]
                          text-[var(--heading)] placeholder:text-[var(--muted-2)] focus:outline-none focus:border-steel-500 transition">
          </div>
          <p x-show="step === 'error'"
             class="text-ruby-500 text-xs bg-ruby-tint border border-ruby-500/30 rounded-lg px-3 py-2"
             x-text="errorMsg"></p>
          <button @click="doPreview()" :disabled="!url.trim()"
                  class="w-full py-2.5 bg-steel-500 text-white rounded-xl text-sm font-semibold
                         hover:bg-steel-400 active:bg-steel-600 transition
                         disabled:opacity-50 disabled:cursor-not-allowed">
            Önizle
          </button>
        </div>
      </template>

      {# ── Importing (preview + import both show this spinner) ── #}
      <template x-if="step === 'importing'">
        <div class="flex flex-col items-center gap-4 py-8">
          <svg class="animate-spin w-8 h-8 text-steel-400" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <p class="text-sm text-[var(--muted)]">İşleniyor…</p>
        </div>
      </template>

      {# ── Preview ── #}
      <template x-if="step === 'preview'">
        <div class="space-y-4">

          <div class="rounded-xl bg-[var(--surface-2)] border border-[var(--border)] p-4 space-y-2">
            <p class="text-sm font-semibold text-[var(--heading)] leading-snug" x-text="preview.title"></p>
            <p class="text-xs text-[var(--muted)]" x-text="preview.channel_title"></p>
            <div class="flex items-center gap-2 flex-wrap pt-1">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
                           bg-steel-500/20 text-steel-400 border border-steel-500/30"
                    x-text="preview.video_count + ' video'"></span>
              <template x-if="preview.detected_exam_type">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
                             bg-amber-500/20 text-amber-400 border border-amber-500/30"
                      x-text="preview.detected_exam_type + ' otomatik algılandı'"></span>
              </template>
              <template x-if="preview.detected_subject_name">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
                             bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                      x-text="preview.detected_subject_name + ' otomatik algılandı'"></span>
              </template>
              <template x-if="preview.already_imported">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
                             bg-amber-500/20 text-amber-400 border border-amber-500/30">
                  Daha önce eklendi — güncellenecek
                </span>
              </template>
            </div>
          </div>

          {# Exam type picker — only when not auto-detected #}
          <template x-if="!preview.detected_exam_type">
            <div>
              <label class="block text-xs font-semibold text-[var(--muted)] mb-1.5 uppercase tracking-wide">Sınav Tipi</label>
              <div class="flex gap-2">
                <template x-for="tip in ['TYT', 'AYT']" :key="tip">
                  <button type="button" @click="selectedExamType = tip"
                          class="flex-1 py-2 rounded-xl text-sm font-bold border transition"
                          :class="selectedExamType === tip
                            ? 'bg-steel-500/20 border-steel-500 text-steel-400'
                            : 'bg-[var(--surface-2)] border-[var(--border)] text-[var(--muted)] hover:bg-[var(--surface-3)]'"
                          x-text="tip"></button>
                </template>
              </div>
            </div>
          </template>

          {# Subject picker — only when not auto-detected #}
          <template x-if="!preview.detected_subject_id">
            <div>
              <label class="block text-xs font-semibold text-[var(--muted)] mb-1.5 uppercase tracking-wide">
                Ders <span class="font-normal normal-case text-[var(--muted-2)]">(isteğe bağlı)</span>
              </label>
              <select x-model="selectedSubjectId"
                      class="w-full border border-[var(--border)] rounded-lg px-3 py-2 text-sm bg-[var(--surface-2)]
                             text-[var(--heading)] focus:outline-none focus:border-steel-500 transition">
                <option value="">Diğer</option>
                <template x-for="s in subjects.filter(s => !selectedExamType || s.exam_type === selectedExamType)"
                          :key="s.id">
                  <option :value="s.id" x-text="s.display_name"></option>
                </template>
              </select>
            </div>
          </template>

          <p x-show="errorMsg"
             class="text-ruby-500 text-xs bg-ruby-tint border border-ruby-500/30 rounded-lg px-3 py-2"
             x-text="errorMsg"></p>

          <div class="flex gap-2">
            <button @click="reset()"
                    class="flex-1 py-2.5 border border-[var(--border)] text-sm font-medium rounded-xl
                           text-[var(--body)] hover:bg-[var(--surface-2)] transition">
              Geri
            </button>
            <button @click="doImport()"
                    class="flex-1 py-2.5 bg-steel-500 text-white rounded-xl text-sm font-semibold
                           hover:bg-steel-400 active:bg-steel-600 transition">
              Playlisti Ekle
            </button>
          </div>
        </div>
      </template>

      {# ── Success ── #}
      <template x-if="step === 'success'">
        <div class="space-y-4">
          <div class="flex flex-col items-center gap-3 py-4">
            <div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center">
              <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <div class="text-center space-y-1">
              <p class="text-sm font-semibold text-[var(--heading)]" x-text="importResult.title"></p>
              <p class="text-xs text-[var(--muted)]"
                 x-text="importResult.video_count + ' video · ' + importResult.exam_type + (importResult.subject_display ? ' · ' + importResult.subject_display : '')"></p>
              <p x-show="importResult.was_update" class="text-xs text-amber-400">Playlist güncellendi.</p>
            </div>
          </div>
          <button @click="useNow()"
                  class="w-full py-2.5 bg-steel-500 text-white rounded-xl text-sm font-semibold
                         hover:bg-steel-400 active:bg-steel-600 transition">
            Bu playlist ile görev oluştur
          </button>
          <div class="flex gap-2">
            <button @click="reset()"
                    class="flex-1 py-2 border border-[var(--border)] text-xs font-medium rounded-xl
                           text-[var(--body)] hover:bg-[var(--surface-2)] transition">
              Başka Playlist Ekle
            </button>
            <button @click="close()"
                    class="flex-1 py-2 border border-[var(--border)] text-xs font-medium rounded-xl
                           text-[var(--body)] hover:bg-[var(--surface-2)] transition">
              Kapat
            </button>
          </div>
        </div>
      </template>

    </div>
  </div>
</div>
