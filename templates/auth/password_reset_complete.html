{% load static %}
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Şifre Güncellendi · Vagus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'marketing/site.css' %}" />
<style>
  .auth-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .auth-form-side {
    display: flex;
    flex-direction: column;
    padding: 32px 48px;
  }
  .auth-brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 20px; color: white;
    letter-spacing: -0.025em; text-decoration: none;
  }
  .auth-brand svg { color: var(--indigo-bright); }
  .auth-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 380px;
    margin: 0 auto;
    width: 100%;
  }
  .auth-brand-side {
    background: linear-gradient(135deg, #0a0e14 0%, #0f141c 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    border-left: 1px solid var(--border);
  }
  .auth-brand-side::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 30% 30%, rgba(99,102,241,0.25), transparent 60%),
      radial-gradient(ellipse 500px 300px at 80% 70%, rgba(124,58,237,0.18), transparent 60%);
  }
  .auth-brand-content {
    position: relative;
    z-index: 1;
    max-width: 480px;
    text-align: center;
  }
  @media (max-width: 900px) {
    .auth-shell { grid-template-columns: 1fr; }
    .auth-brand-side { display: none; }
    .auth-form-side { padding: 24px; }
  }
</style>
</head>
<body>

<div class="auth-shell">

  <div class="auth-form-side">
    <a href="{{ PUBLIC_SITE_URL|default:'/' }}" class="auth-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5L11.5 18.5C11.7 18.9 12.3 18.9 12.5 18.5L14.5 14.5L16 16.5L19.5 4.5"/></svg>
      Vagus
    </a>

    <div class="auth-content">
      <div style="width:52px; height:52px; border-radius:14px; background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.25); display:flex; align-items:center; justify-content:center; margin-bottom:24px;">
        <svg width="24" height="24" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <h1 style="margin:0 0 12px; font-size:24px; font-weight:700; color:var(--heading); letter-spacing:-0.02em;">Şifrен güncellendi!</h1>
      <p style="margin:0 0 28px; color:var(--muted); font-size:14px; line-height:1.6;">
        Yeni şifren başarıyla kaydedildi. Şimdi giriş yapabilirsin.
      </p>

      <a href="/auth/login/" class="btn btn-primary btn-lg" style="width:100%; display:flex; justify-content:center; text-decoration:none;">
        Giriş Yap
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" style="margin-left:6px;"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>

    <p style="font-size:12px; color:var(--muted-2); text-align:center; margin-top:24px;">© 2026 Vagus · <a href="#" style="color:inherit;">Gizlilik</a> · <a href="#" style="color:inherit;">Şartlar</a></p>
  </div>

  <div class="auth-brand-side">
    <div class="auth-brand-content">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 28px; display:block; filter:drop-shadow(0 0 20px rgba(52,211,153,0.35));">
        <path d="M5 13l4 4L19 7"/>
      </svg>
      <h2 style="font-size:26px; font-weight:700; color:var(--heading); margin:0 0 12px; letter-spacing:-0.02em; line-height:1.2;">Hazırsın!</h2>
      <p style="font-size:15px; color:var(--muted); margin:0; line-height:1.6;">Yeni şifrenle giriş yapabilirsin. Başarılar dileriz.</p>
    </div>
  </div>

</div>

</body>
</html>
